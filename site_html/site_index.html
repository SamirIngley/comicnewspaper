<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comic Newspaper</title>

<link rel="icon" href="/favicon-c-globe.ico">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-c-globe-96x96.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-c-globe-48x48.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:'Archivo', system-ui, sans-serif;
    color:#17171a; background:#fdfdfb;
    line-height:1.6; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
  }
  .wrap{
    width:100%; max-width:3000px;
    padding:clamp(22px,3.5vw,40px) clamp(16px,4vw,40px) 24px;
    margin:0 auto; flex:1; text-align:center;
  }

  /* the one bold touch */
  h1{
    font-family:'Archivo Black', sans-serif; font-weight:400;
    font-size:clamp(2.6rem,8.5vw,5.2rem); line-height:.9; letter-spacing:-.03em;
    text-transform:uppercase;
  }
  h1 .lead{
    display:inline-block; transform:skew(-6deg);
  }
  h1 em{
    font-style:normal; color:#fdfdfb;
    background:#17171a; padding:0 .16em;
    display:inline-block; transform:skew(-6deg);
    margin-left:.06em; letter-spacing:-.03em;
  }
  /* deck below the headline */
  /* masthead: title centered, date + tagline pinned right on the title's baseline */
  .masthead{
    display:grid; grid-template-columns:1fr auto 1fr;
    align-items:center; column-gap:16px;
  }
  .masthead h1{ grid-column:2; }
  .masthead .side{ grid-column:3; justify-self:end; text-align:right; }

  .dateline{
    margin:0; font-size:.78rem; font-weight:600; white-space:nowrap;
    letter-spacing:.14em; text-transform:uppercase; color:#454550;
  }
  .sub{
    margin:5px 0 0; color:#77777f; font-weight:300;
    font-size:.92rem; line-height:1.05; max-width:22ch;
  }
  @media(max-width:640px){
    .masthead{ grid-template-columns:1fr; }
    .masthead h1{ grid-column:1; }
    .masthead .side{ grid-column:1; justify-self:center; text-align:center; margin-top:8px; }
    .sub{ max-width:none; }
  }

  figure{ margin-top:clamp(16px,2.5vw,26px); }

  /* hand-inked wobbly panel border, hugging the image */
  .frame{ position:relative; padding:9px; }
  .frame .border{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; overflow:visible;
  }
  .frame .border path{
    fill:none; stroke:#17171a; stroke-width:7;
    stroke-linejoin:round; stroke-linecap:round;
  }
  .viewport{
    overflow:hidden; position:relative;
    touch-action:pan-y;
  }
  .viewport.zoomed{ cursor:grab; touch-action:none; }
  .viewport.dragging{ cursor:grabbing; }
  .comic-img{
    width:100%; display:block;
    transform-origin:0 0; will-change:transform;
  }
  .hint{ margin-top:14px; font-size:.78rem; color:#9a9aa2; }
  .placeholder{
    aspect-ratio:3/2; width:100%; background:#f2f2ee;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:28px; color:#77777f;
  }
  .placeholder code{ font-family:ui-monospace,Menlo,monospace; font-size:.85rem;
    background:#fff; border:1px solid #ddd; padding:2px 8px; }

  footer{ padding:20px 0 26px; font-size:.82rem; color:#9a9aa2; text-align:center; }
  footer .made{ display:block; margin-top:4px; }
  footer a{ color:#17171a; text-decoration:none; border-bottom:1px solid #17171a; }
  footer a:hover{ color:#9a9aa2; border-color:#9a9aa2; }
</style>
<script>
  const TIME_ZONE = 'America/Los_Angeles';
  console.log("Timezone: ", TIME_ZONE)
</script>
</head>

<body>

  <div class="wrap">
    <header>
      <div class="masthead">
        <h1><span class="lead">Comic</span><em>Newspaper</em></h1>
        <div class="side">
          <p class="dateline" id="dateline"></p>
          <p class="sub">The day's news, drawn as one scene.</p>
        </div>
      </div>
    </header>

    <figure>
      <div class="frame">
        <svg class="border" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">
          <path vector-effect="non-scaling-stroke" d="M 5 6
                   C 160 1, 330 11, 500 4
                   S 840 9, 995 3
                   C 999 130, 992 240, 997 355
                   S 992 555, 996 694
                   C 840 699, 660 689, 500 696
                   S 160 691, 5 697
                   C 1 560, 9 445, 3 330
                   S 8 140, 5 6 Z"/>
        </svg>
        <div class="viewport" id="vp">
          <img class="comic-img" id="img"
               alt="Today's news drawn as one detailed scene"
               onerror="document.getElementById('vp').style.display='none';document.getElementById('ph').style.display='flex';">
        </div>

        <script>
          const datePart = new Intl.DateTimeFormat('en-CA', {
              timeZone: TIME_ZONE,
              year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date());
          const dailyFileName = `daily-ai-images/ai-image-${datePart}.png`;
  
          document.getElementById("img").src = dailyFileName;
          console.log("file date: ", dailyFileName);
        </script>

        <div class="placeholder" id="ph">
          <div>Can't find image. Unexpected error.</div>
          <div>Please reach out to me samir.ingle7@gmail.com</div>
        </div>
      </div>
    </figure>
  </div>

  <footer>
    A new scene every morning
    <span class="made">Made by <a href="https://samiringle.com" target="_blank" rel="noopener">samiringle.com</a></span>
  </footer>

<script>
const dateline = new Date().toLocaleDateString('en-US', {
      timeZone: TIME_ZONE,
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
document.getElementById('dateline').textContent = dateline;
console.log("line date: ", dateline);

(function(){
  var vp = document.getElementById('vp');
  var img = document.getElementById('img');
  if(!vp || !img) return;

  var s = 1, tx = 0, ty = 0, MAX = 8;

  function clamp(){
    var w = vp.clientWidth, h = vp.clientHeight;
    tx = Math.min(0, Math.max(w * (1 - s), tx));
    ty = Math.min(0, Math.max(h * (1 - s), ty));
  }
  function apply(){
    clamp();
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    vp.classList.toggle('zoomed', s > 1.001);
  }
  function zoomAt(x, y, factor){
    var ns = Math.min(MAX, Math.max(1, s * factor));
    factor = ns / s;
    tx = x - (x - tx) * factor;
    ty = y - (y - ty) * factor;
    s = ns;
    apply();
  }
  function localXY(e){
    var r = vp.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  // trackpad pinch (ctrl+wheel) and ctrl+scroll zoom
  vp.addEventListener('wheel', function(e){
    if(!e.ctrlKey && s <= 1.001) return;
    e.preventDefault();
    var p = localXY(e);
    zoomAt(p[0], p[1], Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)));
  }, {passive:false});

  // double-click: zoom in on that spot, or reset if already zoomed
  vp.addEventListener('dblclick', function(e){
    e.preventDefault();
    var p = localXY(e);
    if(s > 1.001){ s = 1; tx = 0; ty = 0; apply(); }
    else zoomAt(p[0], p[1], 2.5);
  });

  // pointer drag to pan; two-pointer pinch on touch
  var pts = new Map(), lastDist = 0;
  vp.addEventListener('pointerdown', function(e){
    pts.set(e.pointerId, e);
    if(s > 1.001 || pts.size === 2){ vp.setPointerCapture(e.pointerId); vp.classList.add('dragging'); }
  });
  vp.addEventListener('pointermove', function(e){
    if(!pts.has(e.pointerId)) return;
    var prev = pts.get(e.pointerId);
    pts.set(e.pointerId, e);
    if(pts.size === 2){
      var arr = Array.from(pts.values());
      var dist = Math.hypot(arr[0].clientX - arr[1].clientX, arr[0].clientY - arr[1].clientY);
      var r = vp.getBoundingClientRect();
      var cx = (arr[0].clientX + arr[1].clientX)/2 - r.left;
      var cy = (arr[0].clientY + arr[1].clientY)/2 - r.top;
      if(lastDist > 0) zoomAt(cx, cy, dist / lastDist);
      lastDist = dist;
    } else if(s > 1.001){
      tx += e.clientX - prev.clientX;
      ty += e.clientY - prev.clientY;
      apply();
    }
  });
  function up(e){
    pts.delete(e.pointerId);
    if(pts.size < 2) lastDist = 0;
    if(pts.size === 0) vp.classList.remove('dragging');
  }
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', up);

  // block page pinch-zoom while two fingers are on the image
  vp.addEventListener('touchmove', function(e){
    if(e.touches.length > 1) e.preventDefault();
  }, {passive:false});

  img.addEventListener('dragstart', function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
